<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative OS / Objectives</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b0a;color:#e8f0eb;font:15px system-ui;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:32px 32px}main{max-width:1100px;margin:auto;padding:35px 20px}header,nav,.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}small,.muted{color:#98a69f}h1{font-size:clamp(42px,8vw,84px);letter-spacing:-.07em;line-height:1;margin:38px 0 12px}em{color:#72ffa7;font-style:normal;text-shadow:0 0 25px #38ff8170}button,textarea{font:inherit;color:inherit}button{cursor:pointer;background:#101813;border:1px solid #34483b;border-radius:10px;padding:10px 15px}button:hover,button.active{border-color:#72ffa7;box-shadow:0 0 15px #72ffa725}nav{justify-content:flex-start;margin:26px 0}.panel{background:#101612;border:1px solid #283a30;border-radius:18px;padding:22px;margin:18px 0}.bar{height:6px;background:#25352a;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#72ffa7;box-shadow:0 0 14px #72ffa7}.phase{position:relative;padding:0 0 50px}.phase:after{content:'';position:absolute;left:50%;bottom:0;height:50px;width:2px;background:#72ffa7;box-shadow:0 0 12px #72ffa7}.phase:last-child:after{display:none}.hub{position:relative;text-align:center;border:1px solid #72ffa7;background:#102019;border-radius:15px;padding:18px;max-width:400px;margin:auto;box-shadow:0 0 25px #72ffa722}.hub h2{margin:6px 0}.branches{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:24px 64px;padding:32px 0}.branches:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:#72ffa780;box-shadow:0 0 10px #72ffa750}.node{position:relative;background:#111713;border:1px solid color-mix(in srgb,var(--c) 45%,#18221b);border-radius:14px;padding:18px;box-shadow:0 0 20px color-mix(in srgb,var(--c) 9%,transparent)}.node:after{content:'';position:absolute;top:35px;width:32px;height:1px;background:var(--c);box-shadow:0 0 8px var(--c)}.node:nth-child(odd):after{right:-33px}.node:nth-child(even):after{left:-33px}.node.done{border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 25%,transparent)}.nodehead{display:flex;align-items:center;gap:12px}.check{border:2px solid var(--c);border-radius:50%;width:29px;height:29px;padding:0;flex-shrink:0;color:var(--c);background:transparent}.done .check{background:var(--c);color:#07100a;box-shadow:0 0 12px var(--c)}.cat{color:var(--c);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.node h3{margin:5px 0;font-size:19px}.node p{line-height:1.5}.criteria{border-top:1px solid #ffffff18;padding-top:12px;color:#b9c8bf;font-size:13px}.criteria b{display:block;color:var(--c);margin-bottom:5px}.focus{font-size:12px;margin-top:10px}.focused{outline:2px solid var(--c);outline-offset:3px}textarea{width:100%;min-height:180px;background:#080b09;border:1px solid #34483b;border-radius:10px;padding:15px}footer{color:#98a69f;margin:25px 0}@media(max-width:650px){.branches{grid-template-columns:1fr;padding-left:24px;gap:18px}.branches:before{left:5px}.node:nth-child(n):after{left:-20px;right:auto;width:19px}.phase:after{left:5px}.hub{margin-left:0}.node{padding:14px}}
</style><main><header><b>CREATIVE / OS</b><small>OBJECTIVE TREE / V.04</small></header><h1>Build your own<br>identity<em>.</em></h1><p class="muted">Keine täglichen Pflichten. Echte Fähigkeiten, Werke und Meilensteine.</p><nav id="nav"></nav><div id="view"></div><footer>Dein Tempo. Deine Arbeit. Kein Wettbewerb.</footer></main><script>
const phases=[["Foundation","Grundlagen beherrschen",[["sew","Fashion","Hand sewing fundamentals","Rückstich, Saumstich, Fadenabschluss und Stoffverbindungen üben.","Drei Techniken selbstständig anwenden und eine Reparatur sauber abschliessen."],["knowledge","Knowledge","Fashion literacy","Silhouetten, Materialien, Konstruktion und ausgewählte Designer recherchieren.","Ein eigenes visuelles Archiv mit zehn kommentierten Referenzen erstellen."],["money","Money","Reselling system","Inventar, Einkaufskosten, Gebühren und Versand organisieren.","Alle aktiven Artikel erfassen und tatsächlichen Gewinn berechnen."],["portfolio","Art","Portfolio foundation","Bestehende Kunst und Fashion-Arbeiten kuratieren.","Eine veröffentlichte Portfolio-Basis mit ausgewählten Werken."]]],["Creation","Eigene Werke erschaffen",[["upcycle","Fashion","First wearable piece","Ein Kleidungsstück bewusst umgestalten und Techniken vertiefen.","Ein tragbares, dokumentiertes 1/1 Piece fertigstellen."],["art","Art","Develop a visual series","Ein zusammenhängendes Thema analog oder digital bearbeiten.","Drei zusammengehörige Werke fertigstellen."],["styling","Styling","Styling fundamentals","Proportionen, Layering, Farbkonzepte und Sourcing erproben.","Drei vollständige Looks mit begründetem Konzept dokumentieren."]]],["Identity","Eine eigene Handschrift entwickeln",[["collection","Fashion","Signature pieces","Aus Referenzen und bisherigen Experimenten eine eigene Designsprache entwickeln.","Zwei weitere tragbare Pieces mit erkennbarer Verbindung fertigstellen."],["direction","Styling","Creative direction","Moodboard, Location, Licht und Looks zu einem Konzept verbinden.","Ein vollständiges Shooting-Konzept erstellen und umsetzen."],["publish","Art","Public creative identity","Portfolio und öffentliche Präsenz aufeinander abstimmen.","Eine kuratierte Serie mit Credits und Prozess veröffentlichen."]]],["Exposure","Kreative Beziehungen aufbauen",[["collab","Network","First credited collaboration","Mit einem Artist oder Fotografen ein gemeinsames Projekt planen.","Ein freiwilliges Projekt mit klarer eigener Rolle und vereinbarten Credits veröffentlichen."],["community","Network","Build creative relationships","Events besuchen und echte gemeinsame Interessen vertiefen.","Mindestens eine weitere gemeinsame kreative Arbeit anstossen."],["sales","Money","Validate demand","Eigene Pieces oder kreative Dienstleistungen testweise anbieten.","Feedback, Kosten und tatsächliche Nachfrage dokumentieren."]]],["Expansion","Projekte vertiefen",[["capsule","Fashion","Mini capsule","Eine kleine zusammenhängende Kollektion entwickeln.","Drei bis fünf fertige, fotografierte Looks oder Pieces."],["editorial","Styling","Independent editorial","Ein Shooting mit mehreren Beteiligten selbst konzipieren.","Ein vollständiges Editorial mit Credits veröffentlichen."],["optional","Optional","Music / Percground experiment","Nur bei Interesse ein begrenztes Musik- oder Eventkonzept testen.","Ein abgeschlossenes Experiment oder eine bewusste Entscheidung, es zurückzustellen."]]],["Independence","Tragfähige Perspektive entwickeln",[["income","Money","Sustainable income","Reselling und kreative Einnahmen über mehrere Monate auswerten.","Wiederholbare Einnahmen, Kosten und Rücklagen nachvollziehbar dokumentieren."],["future","Art","Next creative chapter","Portfolio, Fähigkeiten und berufliche Optionen überprüfen.","Eine begründete Entscheidung über die nächsten sechs Monate treffen."]]]];const colors={Fashion:'#72ffa7',Knowledge:'#80caff',Money:'#f4d77c',Art:'#ff9bc7',Styling:'#c5a0ff',Network:'#ffad78',Optional:'#a0a9b4'};const all=phases.flatMap(p=>p[2]);let state;try{state=JSON.parse(localStorage.getItem('creative-os-v1'))||{}}catch{state={}}state.done??={};state.objectives??={};state.notes??='';let tab='Roadmap';const save=()=>localStorage.setItem('creative-os-v1',JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toggle(id){state.objectives[id]=!state.objectives[id];if(state.objectives[id]&&state.focus===id)state.focus=null;save();render()}function focus(id){state.focus=state.focus===id?null:id;save();render()}function node(a){let [id,c,t,d,k]=a;let done=state.objectives[id];return `<article class="node ${done?'done':''} ${state.focus===id?'focused':''}" style="--c:${colors[c]}"><div class="nodehead"><button class="check" aria-label="Objective abgeschlossen" aria-pressed="${!!done}" onclick="toggle('${id}')">${done?'✓':''}</button><div><div class="cat">${c}</div><h3>${t}</h3></div></div><p>${d}</p><div class="criteria"><b>COMPLETION CRITERIA</b>${k}</div>${done?'':`<button class="focus" onclick="focus('${id}')">${state.focus===id?'Fokus entfernen':'Als aktuellen Fokus wählen'}</button>`}</article>`}function progress(a){let required=a.filter(x=>x[1]!=='Optional'),n=required.filter(x=>state.objectives[x[0]]).length;return `<p class="muted">${n} / ${required.length} Objectives</p><div class="bar"><i style="width:${required.length?100*n/required.length:0}%"></i></div>`}function render(){document.querySelector('#nav').innerHTML=['Roadmap','Overview','Ideas'].map(x=>`<button class="${tab===x?'active':''}" onclick="tab='${x}';render()">${x}</button>`).join('');let h='';if(tab==='Roadmap')h=phases.map((p,i)=>`<section class="phase"><div class="hub"><small>PHASE 0${i+1}</small><h2>${p[0]}</h2><div>${p[1]}</div>${progress(p[2])}</div><div class="branches">${p[2].map(node).join('')}</div></section>`).join('');if(tab==='Overview'){let a=all.find(x=>x[0]===state.focus)||all.find(x=>!state.objectives[x[0]]&&x[1]!=='Optional');h=`<div class="panel"><small>OVERALL PROGRESS</small>${progress(all)}</div><div class="panel"><h2>Current objective</h2><p>Ein Schwerpunkt reicht. Keine Deadline, kein täglicher Zwang.</p>${a?node(a):'Alle Kernziele abgeschlossen.'}</div>`}if(tab==='Ideas')h=`<div class="panel"><h2>Idea parking lot</h2><textarea oninput="state.notes=this.value;save()">${esc(state.notes)}</textarea></div>`;document.querySelector('#view').innerHTML=h}render();</script></html>
