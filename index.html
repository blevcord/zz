=id)state.focus=null;save();render()}function focus(id){state.focus=state.focus===id?null:id;save();render()}function node(a){let [id,c,t,d,k]=a;let done=state.objectives[id];return `<article class="node ${done?'done':''} ${state.focus===id?'focused':''}" style="--c:${colors[c]}"><div class="nodehead"><button class="check" aria-label="Objective abgeschlossen" aria-pressed="${!!done}" onclick="toggle('${id}')">${done?'✓':''}</button><div><div class="cat">${c}</div><h3>${t}</h3></div></div><div class="criteria"><b>COMPLETION CRITERIA</b>${k}</div>${done?'':`<button class="focus" onclick="focus('${id}')">${state.focus===id?'Fokus entfernen':'Als aktuellen Fokus wählen'}</button>`}</article>`}function progress(a){let required=a.filter(x=>x[1]!=='Optional'),n=required.filter(x=>state.objectives[x[0]]).length;return `<p class="muted">${n} / ${required.length} Objectives</p><div class="bar"><i style="width:${required.length?100*n/required.length:0}%"></i></div>`}function render(){document.querySelector('#nav').innerHTML=['Roadmap','Overview','Ideas'].map(x=>`<button class="${tab===x?'active':''}" onclick="tab='${x}';render()">${x}</button>`).join('');let h='';if(tab==='Roadmap')h=phases.map((p,i)=>`<section class="phase"><div class="hub"><small>PHASE 0${i+1}</small><h2>${p[0]}</h2><div>${p[1]}</div>${progress(p[2])}</div><div class="branches">${p[2].map(node).join('')}</div></section>`).join('');if(tab==='Overview'){let a=all.find(x=>x[0]===state.focus&&!state.objectives[x[0]])||all.find(x=>!state.objectives[x[0]]&&x[1]!=='Optional');h=`<div class="panel"><small>OVERALL PROGRESS</small>${progress(all)}</div><div class="panel"><h2>Current objective</h2><p>Ein Schwerpunkt reicht. Keine Deadline, kein täglicher Zwang.</p>${a?node(a):'Alle Kernziele abgeschlossen.'}</div>`}if(tab==='Ideas')h=`<div class="panel"><h2>Idea parking lot</h2><textarea oninput="state.notes=this.value;save()">${esc(state.notes)}</textarea></div>`;document.querySelector('#view').innerHTML=h}render();</
