k="markTask('${t.id}')">${state.academy[t.id]?'✓':''}</button> ${esc(t.title)}</h3><p>${esc(t.task)}</p><details><summary>Notizen / Skill-Nachweis</summary><textarea placeholder="Ergebnis, Fehler, Quellen, nächste Schritte" oninput="state.learningNotes['${t.id}']=this.value;save()">${esc(state.learningNotes[t.id]||'')}</textarea></details></article>`).join('')}</div>`};function statistics(){let d=completed(),points=d.reduce((a,t)=>a+xp(t),0);return `<div class="panel"><small>ACADEMY STATISTICS</small><div class="statgrid"><div><h2>${d.length}/600</h2>Objectives</div><div><h2>${points}</h2>XP</div><div><h2>${1+Math.floor(points/200)}</h2>Level</div><div><h2>${Math.round(d.length/6)}%</h2>Fortschritt</div></div></div><div class="panel"><h2>Kapitel</h2>${curriculum.map((p,i)=>{let n=p.filter(t=>state.academy[t.id]).length;return `<p>${phases[i][0]} — ${n}/100</p><div class="bar"><i style="width:${n}%"></i></div>`}).join('')}</div><div class="panel"><h2>Schwierigkeitsgrade</h2>${['Basic','Practice','Advanced'].map(l=>`<p>${l}: ${d.filter(t=>t.level===l).length} / ${tasks.filter(t=>t.level===l).length}</p>`).join('')}<button onclick="exportProgress()">Backup exportieren</button></div>`};function exportProgress(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='creative-os-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};function render(){document.querySelector('#nav').innerHTML=['Roadmap','Academy','Statistics','Overview','Ideas'].map(x=>`<button class="${tab===x?'active':''}" onclick="tab='${x}';render()">${x}</button>`).join('');let h='';if(tab==='Roadmap')h=phases.map((p,i)=>`<section class="phase"><div class="hub"><small>PHASE 0${i+1}</small><h2>${p[0]}</h2><div>${p[1]}</div>${progress(p[2])}</div><div class="branches">${p[2].map(node).join('')}</div></section>`).join('');if(tab==='Overview'){let a=all.find(x=>x[0]===state.focus&&!state.objectives[x[0]])||all.find(x=>!state.objectives[x[0]]&&x[1]!=='Optional');h=`<div class="panel"><small>OVERALL PROGRESS</small>${progress(all)}</div><div class="panel"><h2>Current objective</h2><p>Ein Schwerpunkt reicht. Keine Deadline, kein täglicher Zwang.</p>${a?node(a):'Alle Kernziele abgeschlossen.'}</div>`}if(tab==='Ideas')h=`<div class="panel"><h2>Idea parking lot</h2><textarea oninput="state.notes=this.value;save()">${esc(state.notes)}</textarea></div>`;if(tab==='Academy')h=academy();if(tab==='Statistics')h=statistics();document.querySelector('#view').innerHTML=h}render();</script></html>
