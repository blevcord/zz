<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative Roadmap</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font:15px system-ui}main{max-width:1050px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center}small,.muted{color:#999}h1{font-size:clamp(36px,7vw,70px);letter-spacing:-.07em;margin:30px 0 8px}h2{font-size:20px}button,input{font:inherit}button{background:#171717;color:#ddd;border:1px solid #333;padding:10px 14px;border-radius:8px;cursor:pointer}button.active{color:#1ed760;border-color:#1ed760}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.panel{background:#111;border:1px solid #292929;border-radius:14px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.green{color:#1ed760}.bar{height:6px;background:#292929;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#1ed760;box-shadow:0 0 12px #1ed760}label{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #252525;cursor:pointer}input[type=checkbox]{accent-color:#1ed760;width:18px;height:18px;flex-shrink:0}label.done span{text-decoration:line-through;color:#777}textarea{width:100%;min-height:130px;background:#0a0a0a;color:white;border:1px solid #333;border-radius:8px;padding:12px;font:inherit}footer{margin:30px 0;color:#777} .tag{font-size:11px;letter-spacing:.12em;color:#1ed760} </style><main><header><b>CREATIVE / OS</b><small>PERSONAL ROADMAP · 01</small></header><h1>Build your own identity<span class="green">.</span></h1><p class="muted">Fashion · Art · Styling · Independence</p><nav id="nav"></nav><div id="view"></div><footer>Dein Tempo. Deine Arbeit. Kein Wettbewerb.</footer></main><script>
const phases=[{name:'01 / Foundation',time:'Wochen 1–4',goal:'Grundlagen und ein erstes sichtbares Werk.',tasks:['Nähplatz benutzbar machen','Rückstich und Fadenabschluss üben','Zwei Stoffstücke sauber verbinden','Ein kleines Embroidery ausprobieren','Ein vorhandenes Kleidungsstück verändern','Das Ergebnis fotografieren und archivieren','Eine einfache Portfolio-Startseite veröffentlichen']},{name:'02 / Identity',time:'Wochen 5–8',goal:'Eine eigene visuelle Handschrift entwickeln.',tasks:['Ein Moodboard für ein eigenes Piece erstellen','Ein tragbares 1/1 Piece fertigstellen','Ein zweites Piece entwickeln, wenn das erste fertig ist','Detailfotos und Prozess dokumentieren','Ein Werk öffentlich posten','Feedback von einer vertrauten Person einholen']},{name:'03 / Collaboration',time:'Wochen 9–12',goal:'Ein gemeinsames Projekt mit klarer eigener Rolle.',tasks:['Einen Musikfreund für ein freiwilliges Styling-Projekt fragen','Ein Styling-Moodboard erstellen','Zwei Looks mit vorhandener Kleidung zusammenstellen','Ein kleines Shooting organisieren','Bilder mit vereinbarten Credits veröffentlichen','Projekt ins Portfolio aufnehmen','Entscheiden, ob Styling weiter vertieft werden soll']}];
const money=['Offene Ricardo-Bestellungen verpacken und versenden','Inventar und Einkaufskosten erfassen','Verkaufspreise und Gebühren dokumentieren','Einmal pro Woche Listings aktualisieren','Monatlichen Nettogewinn berechnen'];const all=phases.flatMap((p,i)=>p.tasks.map((t,j)=>({id:`${i}-${j}`,t})));let state;try{state=JSON.parse(localStorage.getItem('creative-os-v1'))||{}}catch{state={}}state.done??={};state.notes??='';let tab='Overview';const save=()=>localStorage.setItem('creative-os-v1',JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function task(id,t){return `<label class="${state.done[id]?'done':''}"><input type="checkbox" ${state.done[id]?'checked':''} onchange="toggle('${id}',this.checked)"><span>${esc(t)}</span></label>`}function toggle(id,v){state.done[id]=v;save();render()}function bar(items){let n=items.filter(x=>state.done[x.id]).length;return `<p class="muted">${n} / ${items.length} abgeschlossen</p><div class="bar"><div style="width:${100*n/items.length}%"></div></div>`}function render(){document.querySelector('#nav').innerHTML=['Overview','Roadmap','Money','Ideas'].map(x=>`<button class="${tab===x?'active':''}" onclick="tab='${x}';render()">${x}</button>`).join('');let h='';if(tab==='Overview'){let next=all.find(x=>!state.done[x.id]);h=`<div class="panel"><div class="tag">NEXT ACTION</div><h2>${next?esc(next.t):'Roadmap abgeschlossen – reflektieren und neu planen'}</h2><p class="muted">Eine Aufgabe reicht. 20–45 Minuten, wenn du Energie hast.</p>${next?task(next.id,next.t):''}</div><div class="panel"><div class="tag">90 DAY PROGRESS</div>${bar(all)}</div><div class="grid"><div class="panel"><b class="green">01 / Main focus</b><h2>Fashion & making</h2>Handnähen, Upcycling, eigene Pieces.</div><div class="panel"><b>02 / Supporting</b><h2>Art & portfolio</h2>Visuelle Sprache und Dokumentation.</div><div class="panel"><b>03 / Experiment</b><h2>Styling</h2>Ein Testprojekt, kein zusätzlicher Vollzeitplan.</div></div><div class="panel"><h2>Flexible Woche</h2><p>2 kurze Making-Sessions · 1 Session Reselling · 1 längere kreative Session am Wochenende, wenn möglich.</p><p class="muted">Freunde, Konzerte und Erholung bleiben Teil deines Lebens. Verpasste Sessions müssen nicht nachgeholt werden.</p></div>`}if(tab==='Roadmap')h=phases.map((p,i)=>`<section class="panel"><div class="tag">${p.time}</div><h2>${p.name}</h2><p>${p.goal}</p>${bar(all.filter(x=>x.id.startsWith(i+'-')))}${p.tasks.map((t,j)=>task(`${i}-${j}`,t)).join('')}</section>`).join('');if(tab==='Money')h=`<div class="panel"><h2>Reselling / Cashflow</h2><p class="muted">Separat vom kreativen Fortschritt. Gewinn statt Umsatz. Keine Kündigungsentscheidung aufgrund eines einzelnen guten Monats.</p>${money.map((t,i)=>task('m-'+i,t)).join('')}<button onclick="for(let i=0;i<5;i++)delete state.done['m-'+i];save();render()">Checkliste zurücksetzen</button></div>`;if(tab==='Ideas')h=`<div class="panel"><h2>Idea parking lot</h2><p>Neue Ideen hier sammeln, statt sofort neue Projekte anzufangen. Musik und Percground dürfen warten, ohne aufgegeben zu sein.</p><textarea placeholder="Ideen, Designs, Kontakte, Projekte…" oninput="state.notes=this.value;save()">${esc(state.notes)}</textarea></div>`;document.querySelector('#view').innerHTML=h}render();</script></html>
